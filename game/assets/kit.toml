mesh = "Block_Arch.obj"
material = "Game/Kit/Dungeon"
socket = "opening"
size = [20.0, 20.0, 20.0]

# --- openings ----------------------------------------------------------------

[[piece]]
id = "arch"
role = "opening"
mesh = "Arch.obj"
material = "Game/Kit/Dungeon"
socket = "opening"
size = [20.02, 12.0, 4.0]
pivot = "y_offset" # spans Y 4.81..16.81: it is the head of the opening, not a
                   # full wall, and sits above the floor
y_offset = 4.81

[[piece]]
id = "arch_fence"
role = "opening_barred" # passable to sight, not to the player
mesh = "Arch_Fence.obj"
material = "Game/Kit/DungeonTwoSided"
