material = "Game/Kit/Dungeon"
socket = "opening"
size = [20.0, 20.0, 7.4]

# Door leaves hang inside a frame; they are props of the frame, not grid pieces.
[[piece]]
id = "door"
role = "door_leaf"
mesh = "Door_01.obj"
material = "Game/Kit/Doors"
socket = "prop"
size = [10.0, 15.0, 2.0]

[[piece]]
id = "door_alt"
role = "door_leaf"
