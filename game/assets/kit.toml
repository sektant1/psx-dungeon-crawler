# The modular dungeon kit: what each piece is, how big it is, and where it can
# connect. The generator picks pieces by role and the assembler places them;
# neither has any of this compiled in.
#
# UNITS. Pieces are authored on a 20-unit grid and imported at `scale`, so one
# cell is 20 * 0.2 = 4 m -- the cell_size the level documents already use. All
# sizes below are in *kit units* (pre-scale), straight off the meshes, so this
# file can be checked against the source art without doing arithmetic.
#
# ORIGIN. Every architectural piece is centred on X/Z with its base at Y=0, so
# a placement is just the cell centre. The handful that are not are called out
# with `pivot` below.
#
# SOCKETS. What a piece occupies and what may connect to it:
#   floor    lies flat in a cell, occupies no volume
#   wall     stands on one cell edge, blocks movement across it
#   fill     occupies the whole cell volume (solid)
#   opening  stands on a cell edge and is passable (arch, doorway)
#   prop     free-standing inside a cell, does not constrain the grid
# `span` is how many cells the piece covers along its length; pieces wider than
# one cell may only be placed where that many cells are free.

[kit]
scale = 0.2       # kit units -> metres
cell_size = 20.0  # kit units per cell; 4 m after scale
mesh_dir = "meshes/kit"

# --- floors ------------------------------------------------------------------

[[piece]]
id = "floor"
role = "floor"
mesh = "Floor_Tiles.obj"
material = "Game/Kit/Dungeon"
socket = "floor"
size = [20.0, 0.0, 20.0]

[[piece]]
id = "floor_hexagon"
role = "floor_feature" # ceremonial floor: shrines, boss arenas
mesh = "Hexagon.obj"
material = "Game/Kit/Stone"
socket = "floor"
size = [34.64, 8.0, 40.0]
span = 2

# --- walls -------------------------------------------------------------------
# Wall_01 is the default. The rest are dressing the generator swaps in for
# variety, and they are interchangeable: same footprint, same sockets.

[[piece]]
id = "wall"
role = "wall"
mesh = "Wall_01.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [20.0, 20.0, 5.0]

[[piece]]
id = "wall_thick"
role = "wall"
mesh = "Wall_02.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [20.0, 20.0, 9.0]

[[piece]]
id = "wall_ruin"
role = "wall_damaged" # broken-through walls: ruined wings, collapsed routes
mesh = "Wall_Ruin.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [19.0, 20.0, 5.0]

[[piece]]
id = "wall_half"
role = "wall_half" # half-width; pairs with a doorway or a corner
mesh = "Wall_Half.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [10.0, 20.0, 5.0]

[[piece]]
id = "wall_skull"
role = "wall_feature" # ossuary dressing; reads as a landmark
mesh = "Skull_Wall.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [20.0, 20.0, 5.0]

[[piece]]
id = "wall_skull_half"
role = "wall_feature"
mesh = "Skull_Wall_Half.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [10.0, 20.0, 5.0]

[[piece]]
id = "wall_window"
role = "wall_window" # sightline into the next room; two-sided
mesh = "Windowed_Wall_01.obj"
material = "Game/Kit/DungeonTwoSided"
socket = "wall"
size = [20.0, 20.0, 5.6]

[[piece]]
id = "wall_window_wide"
role = "wall_window"
mesh = "Windowed_Wall_02.obj"
material = "Game/Kit/DungeonTwoSided"
socket = "wall"
size = [20.0, 20.0, 7.4]

# Transition pieces: the corridor changes width across them, so they connect a
# wide run to a narrow one and are not interchangeable with a plain wall.
[[piece]]
id = "wall_expanding"
role = "wall_transition"
mesh = "Wall_Expanding.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [20.0, 20.0, 10.0]

[[piece]]
id = "wall_narrowing"
role = "wall_transition"
mesh = "Wall_Narrowing.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [20.0, 20.0, 10.0]

# Low walls: waist height, so they read as a barrier without blocking sight.
[[piece]]
id = "wall_border"
role = "wall_low"
mesh = "Wall_Border_01.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [20.0, 10.0, 5.0]

[[piece]]
id = "wall_border_alt"
role = "wall_low"
mesh = "Wall_Border_02.obj"
material = "Game/Kit/Dungeon"
socket = "wall"
size = [20.0, 10.0, 5.0]

# --- solids ------------------------------------------------------------------

[[piece]]
id = "block"
role = "fill"
mesh = "Block.obj"
material = "Game/Kit/Dungeon"
socket = "fill"
size = [20.0, 20.0, 20.0]

[[piece]]
id = "block_half"
role = "fill_low" # a step up: the kit's cheapest verticality
