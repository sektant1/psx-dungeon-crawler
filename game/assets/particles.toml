acceleration = [0.0, -11.0, 0.0]
drag = 0.35
rotation_jitter_deg = 180
scale_jitter = 0.45
collide = "bounce"
restitution = 0.22
friction = 0.6
[[effect.emitter]]
direction = [0,1,0]
angle = 70
ttl_min = 0.9
ttl_max = 1.5
velocity_min = 1.2
velocity_max = 2.8
[[effect.colour_ramp]]
t = 0.0
rgba = [0.52, 0.49, 0.45, 1.0]
[[effect.colour_ramp]]
t = 0.8
rgba = [0.38, 0.35, 0.33, 1.0]
[[effect.colour_ramp]]
