# Blood ------------------------------------------------------------------
# Referenced by blood.toml profiles, not spawned by name from C++. The spray
# and the gibs deliberately differ in render mode: fine spatter reads better as
# a sprite, while chunks read better as solid voxels that catch the light.

[[effect]]
name = "blood_spray"
visual_role = "feedback"
material = "Engine/Particles/Fire"
render_mode = "sprite"
base_width = 0.055
base_height = 0.055
quota = 64
loop = false
burst_count = 26
acceleration = [0.0, -11.0, 0.0]
drag = 0.6
rotation_jitter_deg = 180
scale_jitter = 0.35
# Droplets mark whatever they land on. Without this the spray vanishes in
# mid-air and the hit leaves nothing behind.
collide = "decal"
decal_profile = "blood_splat"
[[effect.emitter]]
direction = [0,1,0]
angle = 42
ttl_min = 0.35
ttl_max = 0.85
velocity_min = 2.2
velocity_max = 5.4
[[effect.colour_ramp]]
t = 0.0
rgba = [0.62, 0.045, 0.035, 1.0]
[[effect.colour_ramp]]
t = 1.0
rgba = [0.34, 0.02, 0.02, 1.0]
[[effect.size_ramp]]
t = 0.0
scale = 1.0
[[effect.size_ramp]]
t = 1.0
scale = 0.7

[[effect]]
name = "blood_gibs"
visual_role = "feedback"
material = "Engine/Particles/Fire"
render_mode = "voxel"
base_width = 0.1
