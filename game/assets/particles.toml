# Particle effects for the game.
#
# Every key below is optional and falls back to the default in
# ParticleEffectDesc, so an existing effect never has to be touched when a new
# key is added. Beyond the presentation keys used throughout this file:
#
#   texture       = "ember"                 # PNG stem under particles/textures/,
#                                           # preferred over `material`
#   render_mode   = "sprite" | "voxel"      # billboard, or instanced cube
#   drag          = 0.0                     # linear velocity damping, per second
#   collide       = "none"|"die"|"bounce"|"decal"
#   restitution   = 0.35                    # bounce: normal velocity retained
#   friction      = 0.20                    # bounce: tangential velocity lost
#   decal_profile = "blood_small"           # decal: which mark to leave
#
# Collision is opt-in and globally budgeted: asking for it buys best effort,
# not a guarantee, so a large burst degrades in accuracy rather than framerate.

