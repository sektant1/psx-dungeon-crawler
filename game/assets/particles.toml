# Impact debris -----------------------------------------------------------

# Sparks thrown off a spell hitting stone. They exist to demonstrate bouncing:
# the read is a handful of embers skittering along the floor after the flash has
# already gone, which is what sells the impact as having happened *somewhere*
# rather than in mid-air. Heavy gravity plus drag keeps them from sliding away
# for longer than the eye wants to follow.
[[effect]]
name = "spark_bounce"
visual_role = "feedback"
material = "Engine/Particles/Fire"
render_mode = "sprite"
base_width = 0.05
base_height = 0.05
quota = 48
loop = false
burst_count = 24
acceleration = [0.0, -9.0, 0.0]
drag = 0.9
rotation_jitter_deg = 180
scale_jitter = 0.3
collide = "bounce"
# Low restitution with high friction: two small hops, then rest. A springier
# spark reads as rubber.
restitution = 0.3
friction = 0.45
[[effect.emitter]]
direction = [0,1,0]
angle = 110
ttl_min = 0.5
ttl_max = 0.9
velocity_min = 1.6
velocity_max = 3.4
[[effect.colour_ramp]]
t = 0.0
rgba = [1.0, 0.85, 0.45, 1.0]
[[effect.colour_ramp]]
t = 0.6
rgba = [1.0, 0.35, 0.06, 0.9]
[[effect.colour_ramp]]
t = 1.0
rgba = [0.4, 0.05, 0.01, 0.0]
[[effect.size_ramp]]
t = 0.0
scale = 1.0
[[effect.size_ramp]]
t = 1.0
scale = 0.4

# Chunks knocked out of a wall or a floor. Voxel mode, because a rotating cube
# with flat per-face tones reads as solid debris at this resolution while a
# billboard of the same size reads as a smudge. Larger and slower than the
# sparks so the two layers do not compete.
[[effect]]
name = "stone_debris"
visual_role = "feedback"
material = "Game/AshParticle"
render_mode = "voxel"
base_width = 0.07
base_height = 0.07
quota = 32
loop = false
