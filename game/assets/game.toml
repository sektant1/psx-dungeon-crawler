[window]
title = "Debug"
width = 960
height = 720
# Run unsynced (vsync=true had its own overlay-scanout flicker on this
# Mesa/GL3Plus/XWayland stack) and pace with the frame limiter below.
vsync = false
# Frame limiter: caps the loop so vsync=false doesn't run the GPU flat out.
# The ImGui overlay is patched to retain a ring of vertex/index buffers
# (cmake/patches/ogre-imgui-overlay-fresh-buffer.patch) so capping the fps no
# longer reintroduces the buffer-aliasing flicker. If flicker ever returns on
# other hardware, limit_fps=false (uncapped) is the fallback.
limit_fps = false
max_fps = 144

[render]
# Stop-motion animation rate (OSRS look): player viewmodel, enemy creatures and
# world animation (torch flicker) snap at 1/anim_fps. Camera, movement,
# projectiles, spells and particles stay full-rate. 0 = full rate everything.
anim_fps = 19

[player]
speed = 3.0
mouse_sensitivity = 0.002

[bindings]
move_forward = "W"
move_back = "S"
move_left = "A"
move_right = "D"
sprint = "Left Shift"
walk = "Left Alt"
crouch = "Left Ctrl"
jump = "Space"
slide = "C"
quit = "Escape"
interact = "E"
fire_arrow = "F"
cast_spell = "Q"
cast_beam = "R"
swap_weapon = "X"
deflect = "V"
dodge = "B"
kick = "G"
debug_ui = "F1"
show_colliders = "F3"
show_perf = "F4"

# Attack tunables. Every value is also live-editable in the "Attacks" debug
# panel; edits there apply immediately but are not written back here.
[combat.fireball]
speed = 18.0
radius = 0.14
mass = 0.30
ttl = 6.0
impact_impulse = 3.0
light_colour = [1.0, 0.55, 0.15]
light_range = 4.0
trail_particle = "fireball_trail"
muzzle_particle = "spell_muzzle"
impact_particle = "fireball_impact"

[combat.beam]
range = 40.0
width = 0.06
impulse = 4.0
segment_ttl = 0.10
light_colour = [0.40, 0.70, 1.0]
light_range = 3.0
core_particle = "Game/BeamCore"
impact_particle = "beam_impact"

[combat.arrow]
speed = 60.0
radius = 0.03
half_height = 0.22
mass = 0.10
ttl = 10.0

[combat.melee]
reach = 1.80
radius = 0.50
impulse = 6.0
windup = 0.12
active = 0.13
