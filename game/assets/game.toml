[window]
title = "Debug"
width = 960
height = 720
# Run unsynced (vsync=true had its own overlay-scanout flicker on this
# Mesa/GL3Plus/XWayland stack) and pace with the frame limiter below.
vsync = false
# Frame limiter: caps the loop so vsync=false doesn't run the GPU flat out.
# The ImGui overlay is patched to retain a ring of vertex/index buffers
# (cmake/patches/ogre-imgui-overlay-fresh-buffer.patch) so capping the fps no
# longer reintroduces the buffer-aliasing flicker. If flicker ever returns on
# other hardware, limit_fps=false (uncapped) is the fallback.
limit_fps = false
max_fps = 144

# Stop-motion animation stepping (OSRS / claymation look). Each channel holds
# its pose between snaps at its own rate; 0 = that channel runs smooth. See
# engine/include/eng/StepClock.h for what each channel covers.
#
# Camera, player movement, physics and UI are deliberately NOT stepped and have
# no channel here: stepping the view reads as input lag and makes people motion
# sick, and stepping locomotion makes the controls feel broken rather than
# stylised. Physics keeps running at 60 Hz under every stepped channel, so
# collisions and hit registration are never affected by these numbers.
#
# 12 Hz is the rate the look is named after: classic stop-motion is 24 fps shot
# on twos, i.e. 12 distinct poses a second. Tune live in the debug overlay's
# Animation tab (F1) and paste the result back here.
[animation]
enabled = true
scale = 1.0            # multiplies every rate below
characters_fps = 12    # enemies/NPCs: the channel that carries the look
viewmodel_fps = 14     # hands/weapon: a touch faster, it sits next to the eye
world_fps = 12         # props, torch flicker, animated dressing
particles_fps = 12     # VFX; smooth particles beside stepped chars look broken
projectiles_fps = 30   # arrows/spells must stay trackable, so: fast
phase_jitter = 0.35    # spread per-object step phase so crowds aren't one puppet

[player]
speed = 3.0
mouse_sensitivity = 0.002

[bindings]
move_forward = "W"
move_back = "S"
move_left = "A"
move_right = "D"
sprint = "Left Shift"
walk = "Left Alt"
crouch = "Left Ctrl"
jump = "Space"
slide = "C"
quit = "Escape"
interact = "E"
fire_arrow = "F"
cast_spell = "Q"
cast_beam = "R"
swap_weapon = "X"
deflect = "V"
dodge = "B"
kick = "G"
debug_ui = "F1"
show_colliders = "F3"
show_perf = "F4"

# Attack tunables. Every value is also live-editable in the "Attacks" debug
# panel; edits there apply immediately but are not written back here.
[combat.fireball]
speed = 18.0
radius = 0.14
mass = 0.30
ttl = 6.0
impact_impulse = 3.0
light_colour = [1.0, 0.55, 0.15]
light_range = 4.0
trail_particle = "fireball_trail"
muzzle_particle = "spell_muzzle"
impact_particle = "fireball_impact"

[combat.beam]
range = 40.0
width = 0.06
impulse = 4.0
segment_ttl = 0.10
light_colour = [0.40, 0.70, 1.0]
light_range = 3.0
core_particle = "Game/BeamCore"
impact_particle = "beam_impact"

[combat.arrow]
speed = 60.0
radius = 0.03
half_height = 0.22
mass = 0.10
ttl = 10.0

[combat.melee]
reach = 1.80
radius = 0.50
impulse = 6.0
windup = 0.12
active = 0.13
