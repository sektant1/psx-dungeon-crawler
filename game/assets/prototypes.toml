# --- materials ---------------------------------------------------------------
# The engine ships art-free, shader-driven prototypes for these; unlike the
# checkered surface they still animate, so a missing portal reads as a portal
# that lost its art rather than as broken geometry. Order matters: the
# ascending portal and the specific liquids are matched before their generic
# counterparts.

[[material]]
match = "portalup"
material = "Engine/PrototypePortalUp"

[[material]]
match = "portalascend"
material = "Engine/PrototypePortalUp"

[[material]]
match = "portal"
material = "Engine/PrototypePortal"

[[material]]
match = "lava"
material = "Engine/PrototypeLava"

[[material]]
match = "magma"
material = "Engine/PrototypeLava"

[[material]]
match = "slime"
material = "Engine/PrototypeSlime"

[[material]]
match = "toxic"
material = "Engine/PrototypeSlime"

[[material]]
match = "ooze"
material = "Engine/PrototypeSlime"

[[material]]
match = "water"
material = "Engine/PrototypeLiquid"

[[material]]
match = "liquid"
material = "Engine/PrototypeLiquid"

[[material]]
match = "particle"
material = "Engine/PrototypeParticle"
