# What stands in for an asset that fails to load.
#
# A missing asset never aborts the frame: the renderer substitutes a primitive
# and the loud checkered prototype material. This file decides *which*
# primitive and *which* material, so a missing barrel still reads as a barrel
# and a missing portal still swirls. Without it every miss is a unit box, which
# is correct and unreadable.
#
# `match` is a case-insensitive substring, tested in file order, so the more
# specific rule goes first ("portalup" before "portal"). Mesh rules match the
# asset's *filename* only; material rules match the requested material name.

# --- meshes ------------------------------------------------------------------
# Sized to roughly the silhouette the authored mesh had. Shapes: box,
# beveled_box, cylinder, sphere, cone.
#
# Structural tiles (floor/ceiling/wall/arch/pillar) deliberately have no rule
# and fall through to the unit box. Sizing them by the cell would be right
# visually, but primitives are built centred on their origin while the authored
# tile meshes are modelled base-at-zero, so a cell-sized slab lands half a cell
# out and seals the player inside the room. A small box in the right place
# beats a large one in the wrong place; giving prototypes a pivot convention is
# the real fix.

[[mesh]]
match = "barrel"
role = "prop_barrel"
shape = "cylinder"
radius = 0.38
height = 0.95

[[mesh]]
match = "vase"
role = "prop_barrel"
shape = "cylinder"
radius = 0.38
height = 0.95

