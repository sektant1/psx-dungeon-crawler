# Copy this whole block into game/assets/particles.toml and rename the ID.
[[effect]]
name = "@EFFECT_ID@"
material = "Engine/PrototypeParticle"
base_width = 0.14
base_height = 0.14
quota = 24
loop = false
burst_count = 16
acceleration = [0.0, 0.20, 0.0]
rotation_jitter_deg = 120
scale_jitter = 0.15

[[effect.emitter]]
direction = [0, 1, 0]
angle = 45
ttl_min = 0.20
ttl_max = 0.45
velocity_min = 0.20
velocity_max = 0.75

[[effect.colour_ramp]]
t = 0.0
rgba = [0.90, 0.35, 1.0, 0.85]
[[effect.colour_ramp]]
t = 1.0
rgba = [0.25, 0.02, 0.45, 0.0]

[[effect.size_ramp]]
t = 0.0
scale = 1.0
[[effect.size_ramp]]
t = 1.0
scale = 0.15
