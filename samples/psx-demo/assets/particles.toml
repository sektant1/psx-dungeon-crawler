# Particle effects for the showcase scene.
#
# Authored for this scene specifically rather than borrowed from the game's
# combat set: the showcase is a slow turntable seen from a fixed distance, so
# everything here is tuned for a continuous silhouette read at ~5 m rather than
# for a burst that has to register in a fraction of a second.
#
# All of them use the engine's procedural VFX materials, so the scene ships no
# particle textures of its own. They could instead name `texture = "<stem>"` to
# pick up a generated material from particles/textures/, which is the preferred
# route once a scene ships art.
#
# The optional keys none of these effects need, listed here so the schema is
# discoverable from the file that uses it: `render_mode` ("sprite" | "voxel"),
# `drag`, `collide` ("none" | "die" | "bounce" | "decal") with `restitution`,
# `friction`, and `decal_profile`. The showcase is a turntable with no floor to
# hit, so every effect here stays uncollided.

# --- crystal shrine ---------------------------------------------------------

# Motes lifting off the crystal cluster. The slow rise plus the long tail is
# what reads as "arcane" rather than as smoke: fire particles accelerate and
# die, these drift and fade.
[[effect]]
name = "crystal_motes"
visual_role = "ambient"
material = "Engine/Particles/ArcaneMote"
base_width = 0.085
base_height = 0.085
quota = 90
loop = true
# Barely any gravity: the drift should look like buoyancy, not a lob.
acceleration = [0.0, 0.55, 0.0]
rotation_jitter_deg = 180
scale_jitter = 0.35
[[effect.emitter]]
emission_rate = 14
shape = "box"
box_size = [1.1, 0.15, 1.1]
direction = [0, 1, 0]
angle = 26
ttl_min = 2.2
ttl_max = 3.6
velocity_min = 0.20
velocity_max = 0.55
# Hot pink at birth, cooling to violet: the colour shift over life is what
# stops a mote field reading as a flat sheet of dots.
start_colour = [1.0, 0.36, 0.78, 0.0]
[[effect.colour_ramp]]
t = 0.0
rgba = [1.0, 0.42, 0.86, 0.0]
[[effect.colour_ramp]]
t = 0.18
rgba = [1.0, 0.55, 0.92, 0.95]
[[effect.colour_ramp]]
t = 0.7
rgba = [0.72, 0.34, 0.98, 0.65]
[[effect.colour_ramp]]
t = 1.0
rgba = [0.45, 0.22, 0.85, 0.0]
[[effect.size_ramp]]
t = 0.0
scale = 0.25
[[effect.size_ramp]]
t = 0.25
scale = 1.0
[[effect.size_ramp]]
t = 1.0
scale = 0.4

# A tight, brighter core right at the crystal bases, so the effect has a source
