scale_jitter = 0.2
[[effect.emitter]]
emission_rate = 7
shape = "box"
box_size = [0.5, 0.1, 0.5]
direction = [0, 1, 0]
angle = 18
ttl_min = 0.9
ttl_max = 1.6
velocity_min = 0.15
velocity_max = 0.35
start_colour = [1.0, 0.72, 0.95, 0.0]
[[effect.colour_ramp]]
t = 0.0
rgba = [1.0, 0.80, 0.98, 0.0]
[[effect.colour_ramp]]
t = 0.3
rgba = [1.0, 0.62, 0.93, 1.0]
[[effect.colour_ramp]]
t = 1.0
rgba = [0.85, 0.30, 0.80, 0.0]
[[effect.size_ramp]]
t = 0.0
scale = 1.2
[[effect.size_ramp]]
t = 1.0
scale = 0.2

