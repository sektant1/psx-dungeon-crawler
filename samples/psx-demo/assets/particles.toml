# --- treasure ---------------------------------------------------------------

# Gold dust around the levitating chest. Emitted in a flat disc so it reads as
# an aura the chest sits inside, not as a plume coming off it.
[[effect]]
name = "treasure_dust"
visual_role = "ambient"
material = "Engine/Particles/ArcaneMote"
base_width = 0.075
base_height = 0.075
quota = 70
loop = true
# Slight downward drift: gold is heavy, and it separates this from the crystal
# motes rising a few metres away.
acceleration = [0.0, -0.22, 0.0]
rotation_jitter_deg = 200
scale_jitter = 0.3
[[effect.emitter]]
emission_rate = 12
shape = "box"
box_size = [0.85, 0.5, 0.85]
direction = [0, 1, 0]
angle = 80
ttl_min = 1.6
ttl_max = 2.8
velocity_min = 0.12
velocity_max = 0.42
start_colour = [1.0, 0.85, 0.45, 0.0]
[[effect.colour_ramp]]
t = 0.0
rgba = [1.0, 0.92, 0.62, 0.0]
[[effect.colour_ramp]]
t = 0.2
rgba = [1.0, 0.80, 0.38, 1.0]
[[effect.colour_ramp]]
t = 0.8
rgba = [0.95, 0.58, 0.20, 0.55]
[[effect.colour_ramp]]
t = 1.0
rgba = [0.6, 0.35, 0.10, 0.0]
[[effect.size_ramp]]
t = 0.0
scale = 0.3
[[effect.size_ramp]]
t = 0.3
scale = 1.0
[[effect.size_ramp]]
t = 1.0
scale = 0.35

