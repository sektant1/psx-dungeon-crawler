# Per-texture overrides for the particle texture import.
#
# The import scans engine/assets/particles/textures/ for *.png and generates one
# Ogre material per file, named "Particles/Auto/<stem>". This file only changes
# the defaults; a PNG with no entry here still works, and an entry here whose
# PNG is missing is a startup warning, not an error.
#
# Defaults: blend = "alpha", nearest = true, soft_fade = false, no flipbook.
#
# Effects reference the stem, never the material name:
#
#   [[effect]]
#   name = "torch_fire"
#   texture = "ember"

# [texture.<stem>]
# blend = "additive"                               # "alpha" | "additive"
# flipbook = { rows = 4, cols = 4, fps = 18, loop = true }
# soft_fade = true                                   # fade against scene depth
# nearest = true                                     # false for bilinear

# ---------------------------------------------------------------------------
# Placeholders generated by tools/gen_particle_textures.py. Regenerate rather
# than repaint; delete the entry with the PNG when real art replaces one.

[texture.spark]
blend = "additive"

[texture.ember]
blend = "additive"

[texture.flame_sheet]
blend = "additive"
flipbook = { rows = 4, cols = 4, fps = 16, loop = true }

[texture.smoke]
blend = "alpha"

[texture.blood_drop]
blend = "alpha"

[texture.blood_splat]
blend = "alpha"
