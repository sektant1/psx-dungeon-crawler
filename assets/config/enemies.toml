# --- ranged: holds distance, kites when crowded -----------------------------
# backoff_range is what makes this a distinct type rather than a grunt with a
# bow: below it, the enemy walks backwards instead of attacking.
[archetype.ranged]
inherits = "base"
category = "Ranged"
tier     = 2

[archetype.ranged.visual]
material = "Game/Enemy/RedPale"

[archetype.ranged.stats]
health = 40.0
poise  = 20.0

[archetype.ranged.locomotion]
chase_speed  = 2.8
strafe_speed = 2.8

[archetype.ranged.perception]
sight_range = 26.0

[archetype.ranged.behaviour]
aggression      = 0.5
preferred_range = 11.0
backoff_range   = 6.0
circle_chance   = 0.5
reposition_time = 1.2
flee_health_pct = 0.25

[[archetype.ranged.attack]]
id               = "shot"
weapon           = "enemy_bolt"
min_range        = 3.0
max_range        = 24.0
aim_cone_deg     = 12.0
cooldown         = 2.4
ranged           = true
projectile_speed = 26.0
windup           = 0.6
active           = 0.05
recovery         = 0.7
stamina_cost     = 6.0

# --- caster: slower projectile, applies crowd control -----------------------
[archetype.caster]
inherits = "ranged"
category = "Caster"

[archetype.caster.stats]
