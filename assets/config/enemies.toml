# Enemy definitions.
#
# Two kinds of table live here.
#
#   [archetype.<id>]  a template. Never spawns. This is where a *type* of enemy
#                     is defined: what it is made of and how it thinks.
#   [enemy.<id>]      a spawnable enemy. `inherits` names an archetype (or
#                     another enemy) and every field it does not state comes
#                     from there. Inheritance is transitive.
#
# Adding an enemy is adding one of these tables. There is no C++ to write, no
# registration call, and no factory: EnemyLibrary reads the file, EnemySystem
# turns a row into a body + node + components, and EnemyAI runs the same state
# machine for all of them. The archetypes below are the "different types"
# scaffolding -- between them they cover trash, heavy, skirmisher, ranged,
# caster, charger, ambusher, turret and boss, and any new enemy is a
# recombination of those dials rather than a new behaviour.
#
# Two rules worth knowing before editing:
#   - `[stats.resistances]` and `[[...attack]]` REPLACE the inherited value
#     rather than merging into it. Stating one means stating all of them.
#     Anything else makes "this variant has no resistances" unwritable.
#   - attack `weapon` names a row in weapons.toml. That is where damage,
#     damage type, crit and crowd-control live; the attack here owns range,
#     cadence and timing. One weapon can back several enemies' moves.
#   - ranged attacks may add `[...attack.pattern]` and one or more
#     `[[...attack.pattern.track]]` blocks. Tracks support `aimed`, `fan`, and
#     `ring`; `repeat` + `interval` make bursts, and `rotate_degrees` makes
#     spirals/rotating volleys. All schedules must fit inside attack `active`.
#     `aim` is `facing`, `commit_target`, or `live_target`. Runtime caps each
#     pattern at 8 tracks, 64 repeats/track, 64 shots/volley, and 512 total.
#
# Placeholder art: every enemy is a red cylinder that is exactly its collision
# cylinder, so what you can see is what you can hit. Tint carries the read --
# EnemyRedPale is fast, EnemyRed is standard, EnemyRedDark is heavy,
# EnemyRedElite is a boss.

# ============================================================================
# ARCHETYPES
# ============================================================================

# The root every other archetype starts from. Nothing inherits nothing.
[archetype.base]
name     = "Creature"
category = "Unknown"
tier     = 1

[archetype.base.body]
radius            = 0.35
height            = 1.8
mass              = 70.0
eye_height        = 1.5
separation_radius = 0.9

[archetype.base.visual]
material     = "Game/Enemy/Red"
scale        = [1.0, 1.0, 1.0]
hit_flash    = 0.16
hit_flash_time = 0.12
cast_shadows = true
# Which profile in blood.toml it bleeds. One word covers spray, gibs, decal and
# pool together; "" is a creature that does not bleed at all.
blood        = "human"

# What this archetype sounds like doing each thing it can do. Every row is a cue
# id in audio.toml, and every row an enemy leaves out falls back to
# "enemy.<action>" -- so this table only has to state what differs. Inherited row
# by row, which is what lets a variant change its death cry without restating
# its footsteps.
#
# It replaced three loose `*_sound` fields (hurt, death, telegraph): those were
# the only three moments an enemy could be given a sound, and there was no way
# to author a footstep, a spawn or an idle growl at all.
[archetype.base.sounds]
spawn     = "enemy.spawn"
idle      = "enemy.idle"
alert     = "enemy.alert"
footstep  = "enemy.footstep"
land      = "enemy.land"
telegraph = "enemy.telegraph"
attack    = "enemy.attack"
impact    = "enemy.impact"
hurt      = "enemy.hurt"
block     = "enemy.block"
dodge     = "enemy.dodge"
death     = "enemy.death"

[archetype.base.stats]
health        = 60.0
poise         = 40.0
poise_regen   = 30.0
stamina       = 100.0
stamina_regen = 25.0
death_impulse = 6.0
corpse_time   = 12.0

[archetype.base.locomotion]
walk_speed    = 1.6
chase_speed   = 3.2
strafe_speed  = 2.0
acceleration  = 14.0
turn_rate_deg = 300.0
lunge_speed   = 0.0
step_height   = 0.4

[archetype.base.perception]
sight_range     = 18.0
sight_fov_deg   = 140.0
hearing_range   = 5.0
lose_sight_time = 4.0
alert_time      = 0.45
leash_range     = 0.0

[archetype.base.behaviour]
aggression       = 0.6
preferred_range  = 0.0   # 0 = derive from the longest attack range
backoff_range    = 0.0
circle_chance    = 0.35
reposition_time  = 1.1
flee_health_pct  = 0.0
dodge_chance     = 0.0
think_interval   = 0.2
starts_dormant   = false
stationary       = false

[[archetype.base.attack]]
id           = "swing"
weapon       = "claw"
max_range    = 2.0
aim_cone_deg = 45.0
cooldown     = 1.6
windup       = 0.35
active       = 0.08
recovery     = 0.45
stamina_cost = 8.0
poise_damage = 12.0

# --- trash: numerous, readable, dies fast -----------------------------------
[archetype.grunt]
inherits = "base"
category = "Fodder"

[archetype.grunt.stats]
health = 45.0
poise  = 25.0

[archetype.grunt.behaviour]
aggression    = 0.7
circle_chance = 0.25

# --- heavy: slow, enormous windup, breaks your guard ------------------------
# The design contract of a heavy is that its windup is long enough to punish
# and its poise is high enough that you cannot stagger out of it. Both dials
# are here, not in code.
[archetype.brute]
inherits = "base"
category = "Heavy"
tier     = 3

[archetype.brute.body]
radius     = 0.55
height     = 2.4
mass       = 180.0
eye_height = 2.0
separation_radius = 1.4

[archetype.brute.visual]
material = "Game/Enemy/RedDark"

[archetype.brute.stats]
health        = 220.0
poise         = 110.0
poise_regen   = 22.0
stamina       = 140.0
death_impulse = 10.0

[archetype.brute.locomotion]
walk_speed    = 1.3
chase_speed   = 2.5
strafe_speed  = 1.2
acceleration  = 8.0
turn_rate_deg = 120.0    # slow turn: circling it actually works
lunge_speed   = 3.4      # but it lunges, so circling late does not

[archetype.brute.behaviour]
aggression      = 0.85
circle_chance   = 0.05
reposition_time = 1.4

[[archetype.brute.attack]]
id           = "overhead"
weapon       = "greatclub"
telegraph_effect = "enemy_overhead_telegraph"
max_range    = 3.0
aim_cone_deg = 35.0
cooldown     = 3.0
windup       = 0.95
active       = 0.12
recovery     = 0.9
stamina_cost = 25.0
poise_damage = 55.0

[[archetype.brute.attack]]
id           = "sweep"
weapon       = "greatclub"
telegraph_effect = "enemy_sweep_telegraph"
min_range    = 0.0
max_range    = 3.4
aim_cone_deg = 80.0
cooldown     = 5.0
weight       = 0.6
windup       = 1.15
active       = 0.16
recovery     = 1.1
stamina_cost = 32.0
poise_damage = 70.0
is_sweep     = true
arc          = 1.2

