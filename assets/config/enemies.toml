hearing_range = 3.0
alert_time    = 0.2

# --- sentinel: never moves. Turret, statue, wall trap -----------------------
[archetype.sentinel]
inherits = "ranged"
category = "Sentinel"

[archetype.sentinel.body]
mass = 400.0

[archetype.sentinel.visual]
material = "Game/Enemy/RedDark"

[archetype.sentinel.stats]
health        = 90.0
poise         = 999.0   # cannot be staggered; it is furniture that shoots
death_impulse = 2.0

[archetype.sentinel.behaviour]
stationary      = true
aggression      = 1.0
flee_health_pct = 0.0

# --- boss: leashed, high poise, mixed move list -----------------------------
[archetype.boss]
inherits = "brute"
category = "Boss"
tier     = 5
boss     = true

[archetype.boss.visual]
material = "Game/Enemy/RedElite"
blood    = "boss"      # same effects, twice the amount

[archetype.boss.stats]
health      = 900.0
poise       = 200.0
corpse_time = 0.0        # a boss corpse stays

[archetype.boss.perception]
leash_range = 32.0       # it owns its arena and will not follow you out

