# Player loadout definitions own firing, projectile, and viewmodel presentation.
# Damage remains in [weapon.*] so enemies and player shots share one pipeline.
#
# damage_type: physical | fire | frost | lightning | poison | arcane | true
# cc_on_hit[].kind: stun | root | silence | slow | chill | burn
#   slow/chill magnitude = movement-speed reduction 0..1
#   burn magnitude       = damage per second (dealt as fire over `duration`)
#   stun/root/silence    = magnitude ignored (boolean gate)

[player_weapon.eidolon_arbalest]
slot = 1
name = "EIDOLON ARBALEST"
discipline = "TRIUNE / HEAVY"
payload = "eidolon_bolt"
trigger = "press"
fire_interval = 0.72
arc_cost = 12.0
projectile_count = 3
spread_degrees = 8.0
switch_time = 0.20
muzzle_offset = [0.13, -0.12, 0.48]
muzzle_effect = "eidolon_muzzle"
fire_sound = "weapon.eidolon.fire"
[player_weapon.eidolon_arbalest.projectile]
shape = "cone"
visual_scale = [0.070, 0.42, 0.070]
material = "Game/Prototype/ProjectileEidolon"
trail_effect = "eidolon_trail"
impact_effect = "eidolon_impact"
impact_sound = "weapon.eidolon.impact"
speed = 48.0
lifetime = 1.50
radius = 0.055
mass = 0.18
gravity_factor = 0.0
aim_range = 72.0
[player_weapon.eidolon_arbalest.viewmodel]
position = [0.21, -0.25, -0.59]
rotation = [-5.0, 5.0, 1.0]
glow_school = "frost"
glow_strength = 0.78
# Attachment: the socket on the hand rig this weapon hangs off, and where in
# that socket it sits. Sockets are named in assets/config/viewmodel_hands.toml.
# Set `model = "meshes/viewmodels/weapons/x.glb"` to render a mesh instead of
# the [[...part]] placeholder primitives below -- nothing else changes.
socket = "right_hand"
attach_offset = [0.0, 0.09, 0.0]
attach_rotation = [0.0, 0.0, 0.0]
attach_scale = 0.5
muzzle_socket = "right_middle_tip"
hands_idle_animation = "guard_idle"
hands_draw_animation = "guard_draw"
hands_fire_animation = "push.R"
hands_muzzle_joint = "f_middle.03.R"
hands_muzzle_offset = [0.0, 0.030, 0.0]
fire_duration = 0.38
recoil_distance = 0.14
recoil_pitch_degrees = 13.0
recoil_yaw_degrees = 0.0
recoil_recovery = 12.0
movement_bob = 0.015
movement_bob_speed = 6.5
idle_sway = 0.003
look_sway = 0.0008
[[player_weapon.eidolon_arbalest.viewmodel.part]]
shape = "beveled_box"
position = [0.0, 0.0, 0.0]
rotation = [90.0, 0.0, 0.0]
scale = [0.10, 0.34, 0.08]
material = "Game/ViewModelEidolon"
[[player_weapon.eidolon_arbalest.viewmodel.part]]
shape = "cylinder"
position = [0.0, 0.02, -0.04]
rotation = [0.0, 0.0, 90.0]
scale = [0.025, 0.30, 0.025]
material = "Game/ViewModelEidolonGlow"
enchanted = true

[player_weapon.riven_talon]
# Slot 0: the weapon the player starts with in hand.
slot = 0
name = "RIVEN TALON"
discipline = "SURGE / AGGRESSION"
payload = "riven_spark"
trigger = "automatic"
fire_interval = 0.09
arc_cost = 3.0
projectile_count = 1
spread_degrees = 0.0
switch_time = 0.16
muzzle_offset = [0.22, -0.13, 0.38]
muzzle_effect = "talon_muzzle"
fire_sound = "weapon.talon.fire"
[player_weapon.riven_talon.projectile]
shape = "sphere"
visual_scale = [0.09, 0.09, 0.09]
material = "Game/Prototype/ProjectileTalon"
trail_effect = "talon_trail"
impact_effect = "talon_impact"
impact_sound = "weapon.talon.impact"
speed = 58.0
lifetime = 1.25
radius = 0.060
mass = 0.08
gravity_factor = 0.0
aim_range = 70.0
[player_weapon.riven_talon.viewmodel]
position = [0.27, -0.25, -0.52]
rotation = [-11.0, 10.0, 6.0]
glow_school = "fire"
glow_strength = 0.82
# The finger-gun set, shared with the loadout's other pointed weapon rather
# than the knife clips this used: the talon fires a projectile from the hand,
# and a stabbing animation reads as a melee weapon that happens to shoot.
# See the arbalest above for what these do.
socket = "right_hand"
attach_offset = [0.0, 0.065, 0.0]
attach_rotation = [0.0, 0.0, 0.0]
attach_scale = 0.55
muzzle_socket = "right_index_tip"
hands_idle_animation = "finger_gun_idle"
hands_draw_animation = "finger_gun_fix"
hands_fire_animation = "finger_gun_fire"
# The index fingertip, which is where the finger-gun pose points.
hands_muzzle_joint = "f_index.03.R"
hands_muzzle_offset = [0.0, 0.025, 0.0]
fire_duration = 0.11
recoil_distance = 0.08
recoil_pitch_degrees = 9.0
recoil_yaw_degrees = 4.0
recoil_recovery = 26.0
movement_bob = 0.013
movement_bob_speed = 9.5
idle_sway = 0.005
look_sway = 0.0014
[[player_weapon.riven_talon.viewmodel.part]]
shape = "sphere"
position = [0.0, 0.0, 0.0]
rotation = [0.0, 0.0, 0.0]
scale = [0.10, 0.08, 0.14]
material = "Game/ViewModelTalon"
[[player_weapon.riven_talon.viewmodel.part]]
shape = "cone"
position = [-0.07, 0.06, -0.05]
rotation = [-70.0, 0.0, -12.0]
scale = [0.025, 0.18, 0.025]
material = "Game/ViewModelTalonGlow"
enchanted = true
[[player_weapon.riven_talon.viewmodel.part]]
shape = "cone"
position = [0.0, 0.08, -0.06]
rotation = [-76.0, 0.0, 0.0]
scale = [0.025, 0.21, 0.025]
material = "Game/ViewModelTalonGlow"
enchanted = true
[[player_weapon.riven_talon.viewmodel.part]]
shape = "cone"
position = [0.07, 0.06, -0.05]
rotation = [-70.0, 0.0, 12.0]
scale = [0.025, 0.18, 0.025]
material = "Game/ViewModelTalonGlow"
enchanted = true

