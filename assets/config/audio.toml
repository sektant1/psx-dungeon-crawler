# Named "player.hurt" rather than "player.hit" because an actor's default cue is
# "<kind>.<action>" and the action an actor performs when it survives a blow is
# "hurt" -- the same row an enemy fills in. A cue whose id does not follow the
# convention is reachable only by being named explicitly somewhere, which is the
# state this catalogue was in for every actor sound.
[[cue]]
id = "player.hurt"
files = ["audio/feedback/player_hit_01.wav", "audio/feedback/player_hit_02.wav"]
bus = "warnings"
gain_db = -1.0
gain_variation_db = 0.4
pitch_min = 0.98
pitch_max = 1.02
spatial = false
max_instances = 2
cooldown_seconds = 0.08
priority = "critical"
duck_music_db = -4.0

# --- conventional actor cues -------------------------------------------------
# An actor's action resolves to "<kind>.<action>" when neither the placed entity
# nor its type names a cue, so these are the rows every player, NPC and enemy
# falls back to. They exist here -- rather than only where a weapon or an enemy
# happens to name one -- so that adding an actor to a level produces sound
# without touching any table, and so the sound panel's defaults are real.
#
# A cue with no files on disk is a counted no-op, not an error: the mix policy,
# the buses and the concurrency limits are authored now and the takes land
# later, which is the same staging every cue above is in.

[[cue]]
id = "player.attack"
files = ["audio/foley/player_swing_01.wav", "audio/foley/player_swing_02.wav"]
