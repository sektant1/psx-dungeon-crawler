# Runtime cue catalogue. Paths are logical content paths resolved through
# assets.toml. Source recordings belong under assets/source/audio; runtime WAV,
# FLAC, MP3 or OGG files belong under assets/audio using these names.
#
# Repeated cues use several independently edited takes, not pitch-shifted copies.
# The runtime prevents immediate repeats, then applies only subtle pitch/gain
# variation. Music files are streamed; short SFX are decoded and cached.

[mixer]
max_voices = 96
master_db = -4.0
music_db = -2.0
ambience_db = -3.0
dialogue_db = 0.0
weapons_db = 0.0
sfx_db = -1.0
ui_db = -2.0
warnings_db = 0.0

[ducking]
music_under_dialogue_db = -9.0
attack_seconds = 0.025
release_seconds = 0.45

[[cue]]
id = "player.footstep"
files = [
  "audio/foley/player_step_stone_01.wav",
  "audio/foley/player_step_stone_02.wav",
  "audio/foley/player_step_stone_03.wav",
  "audio/foley/player_step_stone_04.wav",
]
bus = "sfx"
gain_db = -7.0
gain_variation_db = 1.2
pitch_min = 0.96
pitch_max = 1.04
spatial = false
max_instances = 3
cooldown_seconds = 0.08
priority = "low"
limit = "steal_oldest"

[[cue]]
id = "player.land"
files = [
  "audio/foley/player_land_stone_01.wav",
