# All stems within one section must share sample rate, exact length, downbeat and
# loop points. Different sections must begin/end on the declared bar grid.
[music]
bpm = 80.0
beats_per_bar = 4
transition_bars = 1
transition_seconds = 0.35
intensity_rise_seconds = 0.8
intensity_fall_seconds = 3.5
default_section = "exploration"
combat_stinger = "music.stinger.combat"
boss_stinger = "music.stinger.boss"

[[cue]]
id = "music.exploration.bed"
files = ["audio/music/exploration_bed.ogg"]
bus = "music"
gain_db = 0.0
spatial = false
stream = true
loop = true
max_instances = 2
priority = "background"
limit = "reject"

