# The safehouse, and the village around it.
#
# One mechanic, two owners. `owner = "hideout"` is the house the player keeps in
# the village; `owner = "village"` is the street outside it. Both are a project
# with tiers, a cost and something it unlocks, which is deliberate: an NPC's
# questline can finish by paying for a village tier, and the player watches
# their own base and the town improve through the same system (AGENTS.md §16
# wants each major NPC's progression to have "a visible effect on the village").
#
# Tiers are cumulative: each one states what it ADDS, and everything up to the
# built level contributes. Nothing here ticks -- an upgrade completes when it is
# paid for, and time advances through expeditions (§17).

[station.strongbox]
name = "Strongbox"
description = "What is in here is yours whatever happens down there."
owner = "hideout"

[[station.strongbox.tier]]
name = "A Chest with a Lock"
description = "Twenty more places to put things."
currency = 150
stash_slots = 20
[[station.strongbox.tier.material]]
item = "rusted_fitting"
count = 8

[[station.strongbox.tier]]
name = "A Braced Vault"
currency = 500
stash_slots = 40
[[station.strongbox.tier.material]]
item = "rusted_fitting"
count = 25
[[station.strongbox.tier.requirement]]
kind = "level_at_least"
subject = "construction"
value = 15

