[window]
title = "Raven Engine | Game Preview"
width = 960
height = 720
# Run unsynced (vsync=true had its own overlay-scanout flicker on this
# Mesa/GL3Plus/XWayland stack) and pace with the frame limiter below.
vsync = false
# Frame limiter: caps the loop so vsync=false doesn't run the GPU flat out.
# The ImGui overlay is patched to retain a ring of vertex/index buffers
# (cmake/patches/ogre-imgui-overlay-fresh-buffer.patch) so capping the fps no
# longer reintroduces the buffer-aliasing flicker. If flicker ever returns on
# other hardware, limit_fps=false (uncapped) is the fallback.
limit_fps = false
max_fps = 144

# Stop-motion animation stepping (OSRS / claymation look). Each channel holds
# its pose between snaps at its own rate; 0 = that channel runs smooth. See
# engine/include/eng/StepClock.h for what each channel covers.
#
# Camera, player movement, physics and UI are deliberately NOT stepped and have
# no channel here: stepping the view reads as input lag and makes people motion
# sick, and stepping locomotion makes the controls feel broken rather than
# stylised. Physics keeps running at 60 Hz under every stepped channel, so
# collisions and hit registration are never affected by these numbers.
#
# 12 Hz is the rate the look is named after: classic stop-motion is 24 fps shot
# on twos, i.e. 12 distinct poses a second. Tune live in the debug overlay's
# Animation tab (F1) and paste the result back here.
[animation]
enabled = true
scale = 1.0            # multiplies every rate below
characters_fps = 18    # enemies/NPCs: the channel that carries the look
viewmodel_fps = 24     # hands/weapon: fastest stepped channel, it sits next to
                       # the eye where a coarse rate reads as a dropped frame
world_fps = 15         # props, torch flicker, animated dressing
particles_fps = 18     # VFX; smooth particles beside stepped chars look broken
projectiles_fps = 30   # arrows/spells must stay trackable, so: fast
phase_jitter = 0.35    # spread per-object step phase so crowds aren't one puppet

# Dodge: the defensive verb the fight is built around. A dash is a commitment
# -- fixed direction, fixed distance, no steering -- and the i-frames are what
# you are paying stamina for. iframes shorter than duration on purpose: the
# tail of the dash is vulnerable, so a mistimed dodge still gets punished.
# Neutral movement input dashes backwards (the backstep).
[dodge]
speed = 14.0        # m/s during the dash
duration = 0.32     # seconds of movement
cooldown = 0.45     # seconds after it ends before another is allowed
camera_drop = 0.34  # cosmetic crouch arc; collision capsule stays standing
camera_roll_degrees = 360.0 # one complete forward-axis roll
iframes = 0.22      # seconds of invulnerability, from the start of the dash
stamina = 25.0      # cost; an empty bar means no dodge

# Simulation feel. These are game tuning, not engine internals: the engine
# takes them from PhysicsSetup and has no opinion about the numbers.
[physics]
# World gravity in m/s^2, negative is down. Earth is -9.81; we run roughly
# double that because a fast first-person game wants a short, snappy fall arc
# -- a realistic value makes jumps feel floaty and drops feel slow. Raising the
# magnitude shortens jumps and makes props settle harder; lowering it makes the
# whole game feel moon-like.
gravity = -18.0
# How hard the player shoves a dynamic prop they walk into, as a multiple of
# the player's speed along the contact normal (so a fast walk into a barrel
# shoves it harder than a slow one). 0 makes props immovable walls; 2.0 lets
# you clear a crate out of a doorway by walking through it without launching
# it across the room.
character_push_impulse = 2.0
# Multi-threaded physics. Off on purpose. With more than one worker Jolt
# resolves contacts in thread-race order, so a stack of barrels settles
# differently every run and a boss retry is not the same fight. Single-worker
# simulation is reproducible, which is what retries and replays need, and it
# measures at roughly a tenth of a millisecond a frame in this scene. Turn on
# only if a scene gets heavy enough for that to matter.
multithreaded = false

[player]
# Boomer-shooter pace. Heretic and Doom run their marine at roughly this in
# metres per second, and it is the single number that decides whether the game
# reads as a dungeon crawl or as a shooter -- everything below is tuned against
# it, and the viewmodel bob is normalised to bob_reference_speed so retuning it
# does not also retune the hands.
speed = 8.5
mouse_sensitivity = 0.002
# Profile in blood.toml the player bleeds when something lands a hit.
blood = "human"

# How the character accelerates, stops, jumps and falls.
#
# The brief for this movement is "no tactical-shooter inertia": you reach full
# speed in about a tenth of a second and stop in about the same, so a strafe
# reads as a step rather than as a slide. These were compiled-in constants in
# FpsController.cpp until the FPS slice; they are data now precisely because
# they are the numbers that need twenty iterations, not one.
#
# The air model is Doom/Heretic-like, not Quake-like: air input steers toward a
# clamped target, so airborne speed can never exceed ground speed and there is
# no strafe-jump acceleration. Predictability was worth more here than a speed
# technique. See docs/fps-gameplay.md.
#
# move_speed is NOT here on purpose -- it is `speed` above, which is also what a
# level's First-Person Controller component overrides.
[player.movement]
# m/s^2 toward the input while grounded. 90 covers 0 -> 8.5 m/s in ~0.09 s,
# which is below the threshold where a ramp is perceptible at all.
ground_acceleration = 90.0
# m/s^2 back to rest with no input. Slightly less than acceleration so a hard
# stop still costs a moment, but nowhere near ice.
ground_friction = 70.0
# m/s^2 while airborne: enough to commit to a different direction mid-jump,
# not enough to make jumping a faster way to travel.
air_acceleration = 22.0
# Upward m/s on jump. Against the world's -18 gravity that is a ~1.55 m apex
# and ~0.83 s of hang -- clears a crate, does not float.
jump_velocity = 7.5
# Fallback only: used when there is no physics world (tests, tools). The live
# game falls at `[physics] gravity`, because the player and the props it walks
# into have to agree about which way is down.
gravity = 18.0
# Sprint is a lean on top of an already fast run, not the real speed with the
# walk as a penalty. 1.35 * 8.5 = ~11.5 m/s.
sprint_multiplier = 1.35
walk_multiplier = 0.55
crouch_multiplier = 0.50
# Jump forgiveness, seconds: how long after walking off a ledge a jump still
# fires, and how long before landing one is remembered.
coyote_time = 0.10
jump_buffer_time = 0.12

# The shared first-person rig: where the hands sit in front of the eye, and how
# hard each procedural layer is allowed to move them. Every weapon inherits this
# framing and only leans out of it (hands_offset/hands_rotation/hands_scale in
# weapons.toml), so a weapon can never drop the hands out of frame.
#
# Camera space: +x right, +y up, -z forward. The 180 degree yaw turns the source
# rig -- authored facing glTF +z -- around to face the way the camera looks.
#
# Tune live in the debug console's Viewmodel tab (F1), then paste the block it
# copies back over this one. Nothing here changes gameplay: aim comes from the
# camera ray, and the muzzle the projectile leaves from is a joint on the rig.
# The camera. Which shape the game starts in, and how the over-the-shoulder one
# is framed. A level overrides all of this by authoring a ThirdPersonCamera on
# its camera entity (see docs/camera-systems.md); this is what every level that
# does not gets.
#
# mode = "first_person" | "third_person"
[camera]
mode = "first_person"
# The boom. distance is how far behind the pivot the eye sits with nothing in
# the way; pivot_height is chest, not eye, so the head stays off the top of the
# screen when the camera looks down; shoulder_offset moves the character off
# centre so the space they are walking into is the space you can see.
distance = 3.4
pivot_height = 1.45
shoulder_offset = 0.42
fov = 66.0
# Follow rates, per second. Vertical is deliberately much slower: vertical is
# where stairs and landings live, and a camera that tracks them exactly is the
# classic third-person pumping.
follow_rate = 18.0
follow_rate_vertical = 7.0
# Orbit limits. Negative pitch looks down, which raises the eye.
pitch_min_degrees = -62.0
pitch_max_degrees = 32.0
mouse_sensitivity = 0.0026
# Spring arm: the boom comes in instantly when something blocks it and goes
# back out at push_out_speed. The asymmetry is what stops a doorway strobing.
collision_radius = 0.25
push_out_speed = 5.0
min_distance = 0.6
# How fast the body turns to face where it is going. High: a souls character
# pivots, it does not arc.
turn_rate_degrees = 780.0
# Lock-on framing. 0 frames the player, 1 frames the target; a third of the way
# keeps both readable with the target slightly above centre.
lock_framing_bias = 0.34
lock_blend_rate = 9.0
lock_pitch_degrees = -6.0
lock_distance_boost = 1.1

# Who the lock-on can grab and when it lets go. The gap between acquire and
# break is hysteresis: without it a lock flickers as an enemy backs away at
# exactly the limit.
[camera.lock_on]
acquire_range = 16.0
break_range = 22.0
acquire_cone_degrees = 62.0
# Mouse pixels of flick that switch to the next target. A threshold, because
# every tremor would otherwise change target.
switch_threshold_pixels = 190.0
# Seconds the target may stay out of sight before the lock drops. Not zero: an
# enemy crossing behind a pillar mid-swing should not cost you the fight.
occlusion_grace = 0.6

[player_viewmodel]
# Camera space: right / up / forward, with -z ahead. Close to the eye and only
# slightly low, so the hands read as the player's own.
offset = [0.0000, -0.8800, -0.0550]
rotation = [0.00, 180.00, 0.00]
scale = 0.5000
# Multipliers over the per-weapon feel numbers; 0 mutes a layer everywhere.
bob_scale = 1.000
sway_scale = 1.000
recoil_scale = 1.000
# Bob is normalised against this speed, so retuning player.speed does not
# silently retune the walk cycle.
bob_reference_speed = 6.000
bob_roll_degrees = 1.400
# Look sway: the hands lag a mouse flick, clamped so they cannot leave frame,
# then are pulled back to centre at sway_return per second.
sway_return = 9.000
sway_max = 0.0500
sway_roll_degrees = 3.000
# Touchdown dip. The camera itself is deliberately left alone here.
landing_dip = 0.0550
landing_recovery = 9.000
# false freezes every layer at the socket pose -- how you author a placement.
motion_enabled = true

# User mix values. Settings UI should write these dB values (or map a 0..1
# slider through linearToDecibels); content-level balancing lives in audio.toml.
[audio]
master_db = -4.0
music_db = -2.0
ambience_db = -3.0
dialogue_db = 0.0
weapons_db = 0.0
sfx_db = -1.0
ui_db = -2.0
warnings_db = 0.0
max_voices = 96

# Player-facing HUD is rendered at native output resolution after the PSX post
# chain. Scale and contrast are accessibility controls; reduced_motion removes
# fades/flashes without changing combat timing or information.
# The typeface every in-game surface is drawn with: the HUD, the tooltip, the
# banner and the authored UI scenes all share one canvas font. Names a metrics
# file in assets/fonts, generated from a TTF by tools/gen_font_atlas.py -- the
# runtime never reads a TTF, so text measurement is identical on every machine.
[ui]
font = "antiquity.toml"

[hud]
scale = 1.0
opacity = 0.92
high_contrast = false
reduced_motion = false
crosshair = true
numeric_values = true
# Critical HUD inset for TV overscan and displays with unsafe edges. Editor UI
# stage previews this same percentage instead of drawing a cosmetic-only guide.
safe_area_percent = 5.0

[bindings]
# The authored screens (assets/scenes/ui/*.scn). `ui_back` closes whichever is
# open; a conversation has no key of its own because it is opened by talking to
# somebody.
inventory = "Tab"
trade = "B"
ui_back = "Escape"
ui_up = ["Up", "W"]
ui_down = ["Down", "S"]
ui_accept = ["Return", "E"]
ui_left = ["Left", "A"]
ui_right = ["Right", "D"]
move_forward = "W"
move_back = "S"
move_left = "A"
move_right = "D"
sprint = "Left Shift"
walk = "Left Alt"
crouch = "Left Ctrl"
jump = "Space"
slide = "C"
quit = "Escape"
interact = "E"
swap_weapon = "X"
weapon_1 = "1"
weapon_2 = "2"
weapon_3 = "3"
deflect = "V"
dodge = "B"
kick = "G"
# Lock-on toggle. Middle mouse does the same thing, unbound because a mouse
# button is not a key name.
lock_on = "Q"
# Switch between first and third person, live.
camera_toggle = "F6"
debug_ui = "F1"
dev_console = "`"
show_colliders = "F3"
show_perf = "F4"

# Archived sword/staff/torch prototype tuning. Source systems and values remain
# available for later reactivation but are disconnected from the live loadout.
[combat.fireball]
speed = 18.0
radius = 0.14
mass = 0.30
ttl = 6.0
impact_impulse = 3.0
light_colour = [1.0, 0.55, 0.15]
light_range = 4.0
trail_particle = "fireball_trail"
muzzle_particle = "spell_muzzle"
impact_particle = "fireball_impact"

[combat.beam]
range = 40.0
width = 0.06
impulse = 4.0
segment_ttl = 0.10
light_colour = [0.40, 0.70, 1.0]
light_range = 3.0
core_particle = "Game/Spells/BeamCore"
impact_particle = "beam_impact"

[combat.arrow]
speed = 60.0
radius = 0.03
half_height = 0.22
mass = 0.10
ttl = 10.0

[combat.melee]
reach = 1.80
radius = 0.50
impulse = 6.0
windup = 0.12
active = 0.13

# --- feedback ----------------------------------------------------------------
# Screen shake and hit-stop: the two channels that read as *impact* rather than
# as decoration. Everything else a hit throws (particles, blood, the poise chip,
# the grunt) is authored elsewhere; these two are here because they act on the
# camera and the clock, which belong to nobody in particular.
#
# The two scales at the top are accessibility masters, and 0 switches a channel
# off outright. Screen shake and time distortion are settings people turn down
# for real reasons, so they are one number each and not buried per tier.
[feel]
shake_scale = 1.0
hit_stop_scale = 1.0

# Trauma decays linearly and the shake is trauma SQUARED, so a graze barely
# moves the view and a kill punches. Raise the decay for a snappier settle.
trauma_decay = 3.0
shake_frequency = 22.0
# Metres at full shake, camera space: right, up, forward. Small on purpose --
# the viewmodel moves loudly, the camera moves subtly.
shake_offset = [0.045, 0.036, 0.022]
shake_pitch_degrees = 0.75
shake_roll_degrees = 1.10
# What the game clock runs at during a stop. Not 0: a fully frozen frame reads
# as a hitch, a very slow one reads as weight.
hit_stop_time_scale = 0.08

# Per tier. `light` is a shot leaving the barrel, `solid` a landed hit, `heavy`
# a staggering blow or one the player takes, `kill` a death.
# light carries no hit-stop deliberately: stopping time on a routine action --
# and automatic fire is routine -- is the fastest way to feel broken.
[feel.light]
trauma = 0.10
hit_stop = 0.0
[feel.solid]
trauma = 0.20
hit_stop = 0.035
[feel.heavy]
trauma = 0.45
hit_stop = 0.060
[feel.kill]
trauma = 0.75
hit_stop = 0.110
