# The modular dungeon kit: what each piece is, how big it is, and where it can
# connect. The generator picks pieces by role and the assembler places them;
# neither has any of this compiled in.
#
# UNITS. Pieces are authored on a 20-unit grid and imported at `scale`, so one
# cell is 20 * 0.2 = 4 m -- the cell_size the level documents already use. All
# sizes below are in *kit units* (pre-scale), straight off the meshes, so this
# file can be checked against the source art without doing arithmetic.
#
# ORIGIN. Every architectural piece is centred on X/Z with its base at Y=0, so
# a placement is just the cell centre. The handful that are not are called out
# with `pivot` below.
#
# SOCKETS. What a piece occupies and what may connect to it:
#   floor    lies flat in a cell, occupies no volume
#   wall     stands on one cell edge, blocks movement across it
#   fill     occupies the whole cell volume (solid)
#   opening  stands on a cell edge and is passable (arch, doorway)
#   prop     free-standing inside a cell, does not constrain the grid
# `span` is how many cells the piece covers along its length; pieces wider than
# one cell may only be placed where that many cells are free.

[kit]
scale = 0.2       # kit units -> metres
cell_size = 20.0  # kit units per cell; 4 m after scale
mesh_dir = "meshes/kit"

# --- floors ------------------------------------------------------------------

[[piece]]
id = "floor"
role = "floor"
mesh = "Floor_Tiles.obj"
material = "Game/Kit/Dungeon"
socket = "floor"
size = [20.0, 0.0, 20.0]

[[piece]]
id = "floor_hexagon"
role = "floor_feature" # ceremonial floor: shrines, boss arenas
mesh = "Hexagon.obj"
material = "Game/Kit/Stone"
