# --- set dressing: props authored in metres -----------------------------------
# Everything above is kit art on the 20-unit grid. What follows is the prop set
# under meshes/props, which is authored at world scale, so each piece says
# `import_scale = 1.0` and states its size in METRES -- measured off the .obj
# vertex bounds, the same way the kit sizes were.
#
# They were already in the game (the dungeon generator dresses rooms from
# dungeon_props.toml) but not in this catalogue, so the editor could not place
# one by hand. Multi-part props are listed part by part: each half is its own
# piece, stacked at the same spot, because the catalogue places one mesh with
# one material and the parts wear different ones.

# Authored in Blender and converted with tools/blend_to_obj.py, which is where
# the size below came from -- it prints the line, in metres, in the axis order
# the engine sees. Measuring a converted mesh by hand afterwards is how a piece
# ends up with a footprint that disagrees with its art.
# The portal, as placeable parts. It used to be one C++ factory
# (createPortalProp) that built pillars, a lintel, a backing panel, a membrane,
# a light and a particle effect from a marker -- so a level could have exactly
# the portal that function makes, and the editor could not show or change it.
# As pieces, a portal is entities: place the surround from the kit's own arch
# and pillars, drop the membrane in the opening, and give it a PortalParams to
# tune. Two portals in one level can then differ.
[[piece]]
id = "portal_membrane"
role = "prop_vfx"
mesh = "meshes/props/portal_membrane.obj"
material = "Game/Vfx/PortalDown"
socket = "prop"
import_scale = 1.0
size = [2.8, 2.5, 0.14]
# The membrane animates from per-entity shader parameters; without the
# portal component it is a flat rectangle of the material's static colour.
components = ["portal"]

[[piece]]
id = "portal_membrane_up"
role = "prop_vfx" # the ascending portal: same slab, the other palette
mesh = "meshes/props/portal_membrane.obj"
material = "Game/Vfx/PortalUp"
socket = "prop"
import_scale = 1.0
size = [2.8, 2.5, 0.14]
# The membrane animates from per-entity shader parameters; without the
# portal component it is a flat rectangle of the material's static colour.
components = ["portal"]

