# The lid `chest` is missing. A piece rather than a field on `chest`, because
# the lid has to be its own entity to turn on its own hinge -- and the thing
# that assembles a base, a lid and the script that swings it is a component
# scene (scenes/chest.scn), not the kit. The kit's job is the leaf piece and
# what it measures; composing pieces into a working object is the scene's.
#
# This replaces a `lid_mesh = "Chest_Lid.obj"` line that sat on `chest` and was
# read by nothing, so scenes/chest.scn had to name the mesh and its import
# scale by hand -- two copies of a number kit.toml already owns, and the lid
# would have parted company with its base the day [kit] scale changed.
