[window]
title = "Raven Engine | Scene Editor"
width = 1600
height = 950
vsync = false

# Viewport navigation, TrenchBroom-style: hold the right mouse button to fly,
# and the usual WASD + Q/E while it is held. These names are what
# editor/src/app/EditorApp.cpp asks Input for.
[bindings]
quit = "Escape"
fly_forward = "W"
fly_back = "S"
fly_left = "A"
fly_right = "D"
fly_up = "E"
fly_down = "Q"
fly_fast = "Left Shift"

# Tools and grid. Single letters, deliberately: the editor mutes them while a
# text field has keyboard focus.
tool_select = "Q"
tool_place = "P"
tool_room = "B"
gizmo_move = "W"
gizmo_rotate = "E"
gizmo_scale = "R"
grid_coarser = "["
grid_finer = "]"
toggle_snap = "G"
# Quarter turns for the Place tool's brush. The mouse wheel does this too and is
# the gesture worth learning -- it needs no click, so a piece can be turned
# while it is being lined up. These are here for keyboard-only work.
brush_rotate_cw = "."
brush_rotate_ccw = ","
level_up = "PageUp"
level_down = "PageDown"
level_reset = "Home"
# Local vs world axes. Kit pieces are authored on quarter turns, so a wall at 90
# degrees needs its own frame to nudge along.
gizmo_space = "X"
# Drops the camera to the player's eye at the spawn, with the game's field of
# view. Level readability is judged from head height, and the only way to get
# there used to be F5 -- a full cook and launch.
walk = "V"
focus = "F"
delete = "Delete"
duplicate = "D"
save = "S"
undo = "Z"
redo = "Y"
# Ctrl-modified, all of them. The editor tests the modifier itself, which is
# why `paste` can share V with `walk` and `cut` can share X with `gizmo_space`
# without either stealing the other's key.
open = "O"
copy = "C"
cut = "X"
paste = "V"
help = "F1"
run = "F5"
cook = "F6"
dev_console = "`"
