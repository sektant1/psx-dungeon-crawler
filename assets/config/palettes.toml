# Scene look palettes. Colours are authored in sRGB (0..1) exactly as they
# appear here; applyRenderPalette() linearises the ones the renderer expects in
# linear space. Each [palette.<name>] table starts from the RenderPalette struct
# defaults (the dungeon look) and overrides only the keys it lists.

# Dark-fantasy roguelike: torchlit stone, near black between the lights. Kept in
# step with the engine's "dungeon" render profile (RenderPresets.cpp case 7),
# which owns the pipeline; this owns the art direction on top of it. If you
# retune one, read the other.
#
# The rule behind the numbers: this is a survival look, not a screenshot look.
# Ambient is low enough that a torch is genuinely the reason you can see, but
# never zero, and grade_black_lift stays above the contrast crush -- a player
# who cannot tell a doorway from a wall at 8 metres will not care how
# atmospheric it is. Darkness comes from falloff and fog, not from a black
# ambient term.
[palette.dungeon]
ambient_srgb        = [0.40, 0.44, 0.56]  # cold, faintly blue -- moonless stone
ambient_scale       = 0.085               # was 0.25: torches now do the work
sun_yaw_deg         = 30.0
sun_pitch_deg       = -75.0
# A dungeon has no sun. What is left is a dim cold fill from above so ceilings
# and floors do not read as the same surface.
sun_colour_srgb     = [0.50, 0.56, 0.78]
sun_scale           = 0.16
fog_srgb            = [0.055, 0.058, 0.080]
# 0.070 fogs a 12 m room ~57% and 30 m ~88%: corridors go dark within a couple
# of rooms while the far wall of the room you are fighting in stays readable.
# This and ambient_scale are the two dials for "darker" -- push fog first, and
# keep ambient_scale above ~0.05 or unlit stone drops under the grade's contrast
# crush and silhouettes stop reading at all.
fog_density         = 0.070
background_srgb     = [0.014, 0.014, 0.022]
light_steps         = 0.0     # smooth firelight; banding draws contours on floors
light_step_softness = 0.30
fog_desat_boost     = 0.65    # distance sinks to black, not to grey
light_shaft_colour  = [0.72, 0.66, 0.52, 0.16] # warm dust, not blue moonbeam
grade_desaturate    = 0.12
grade_contrast      = 1.12
grade_shadow_tint   = [0.060, 0.070, 0.130]  # cold blue-black
grade_mid_tint      = [0.58, 0.55, 0.50]     # damp stone
grade_saturation    = 0.88
grade_tint_strength = 0.09    # the cold/warm split does the heavy lifting
grade_black_lift    = 0.028   # the one anti-darkness term: keeps shapes legible
col_depth           = 63.0
dither_banding      = 0.022
dither_dark_fade    = 0.28    # kill the pattern before near-black, or it shimmers
shadow_colour       = [0.020, 0.020, 0.035]
shadow_strength     = 0.20    # contact darkening: props sit on the floor
highlight_colour    = [1.0, 0.70, 0.40]  # convex edges catch the torch
highlight_strength  = 0.10
outline_colour      = [0.015, 0.015, 0.028]
outline_opacity     = 0.30    # readability: silhouette vs. the black behind it
outline_depth_sens  = 9.0
outline_normal_sens = 0.22
vignette_strength   = 0.28    # claustrophobia
vignette_colour     = [0.090, 0.090, 0.150]
bloom_threshold     = 0.62    # low: the flame is the only reason you can see
bloom_intensity     = 0.55

# The showroom is a teaching/test vista: same look as the dungeon but with a
# longer fog reach so the far portal landmark stays readable on arrival.
[palette.showroom]
fog_density = 0.026
