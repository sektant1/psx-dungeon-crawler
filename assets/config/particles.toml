# Blood ------------------------------------------------------------------
# Referenced by blood.toml profiles, not spawned by name from C++. The spray
# and the gibs deliberately differ in render mode: fine spatter reads better as
# a sprite, while chunks read better as solid voxels that catch the light.

[[effect]]
name = "blood_spray"
visual_role = "feedback"
# A texture stem, NOT the fire atlas: Engine/Psx/Fire is a 4x4 flipbook of
# flame frames, so blood wearing it came out orange and animated. blood_drop is
# a plain round droplet, and the ramp below is then the only thing that decides
# what colour blood is.
texture = "blood_drop"
render_mode = "sprite"
base_width = 0.038
base_height = 0.038
quota = 96
loop = false
burst_count = 34
acceleration = [0.0, -11.0, 0.0]
drag = 0.5
rotation_jitter_deg = 180
# Wide on purpose: every droplet a different size, heading and speed, so a hit
# reads as a burst rather than as one stamp played twice.
scale_jitter = 0.8
# Droplets settle where they land rather than stamping a decal: the particles
# and voxels ARE the blood now, so a spray that vanished on contact would leave
# a hit with nothing behind it.
collide = "bounce"
restitution = 0.10
friction = 0.85
[[effect.emitter]]
direction = [0,1,0]
angle = 95
ttl_min = 0.30
ttl_max = 1.05
velocity_min = 1.6
velocity_max = 6.5
[[effect.colour_ramp]]
t = 0.0
rgba = [0.85, 0.06, 0.05, 1.0]
[[effect.colour_ramp]]
t = 1.0
rgba = [0.40, 0.02, 0.02, 1.0]
[[effect.size_ramp]]
t = 0.0
scale = 1.0
[[effect.size_ramp]]
t = 1.0
scale = 0.7

[[effect]]
name = "blood_gibs"
visual_role = "feedback"
# Solid voxel material: the voxel shader has no texture at all, it shades six
# fixed face tones off the instance colour, so a chunk is exactly as red as the
# ramp says. The darkest face is 0.42 of it -- which is why the ramp starts
# bright rather than at the colour blood "is".
material = "Engine/Particles/VoxelSolid"
render_mode = "voxel"
base_width = 0.055
base_height = 0.055
quota = 64
loop = false
burst_count = 20
acceleration = [0.0, -14.0, 0.0]
drag = 0.25
rotation_jitter_deg = 180
scale_jitter = 0.85
# Heavier than the spray and barely bouncy: chunks land and stay.
collide = "bounce"
restitution = 0.16
friction = 0.7
[[effect.emitter]]
direction = [0,1,0]
angle = 180
ttl_min = 1.4
ttl_max = 3.0
velocity_min = 1.4
velocity_max = 5.4
[[effect.colour_ramp]]
t = 0.0
rgba = [0.72, 0.06, 0.05, 1.0]
[[effect.colour_ramp]]
t = 1.0
rgba = [0.34, 0.03, 0.03, 1.0]

[[effect]]
name = "blood_drip"
visual_role = "ambient"
texture = "blood_drop"
render_mode = "sprite"
base_width = 0.026
base_height = 0.036
quota = 32
loop = true
acceleration = [0.0, -12.0, 0.0]
scale_jitter = 0.6
collide = "bounce"
restitution = 0.08
friction = 0.9
[[effect.emitter]]
direction = [0,-1,0]
angle = 22
emission_rate = 7
ttl_min = 0.6
ttl_max = 1.1
velocity_min = 0.1
velocity_max = 0.6
[[effect.colour_ramp]]
t = 0.0
rgba = [0.70, 0.05, 0.04, 1.0]
[[effect.colour_ramp]]
t = 1.0
rgba = [0.38, 0.02, 0.02, 1.0]

