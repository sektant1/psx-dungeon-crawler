# Blood: which effects a creature throws.
#
# Nothing in engine/ reads this file. The particle system throws generic
# particles; deciding that a "human" bleeds dark red and a construct sheds
# sparks is a gameplay call, so it lives here and is parsed by
# game/src/BloodSystem.cpp.
#
# Adding a creature type is a [[profile]] block; it needs no C++.
#
# Blood is particles and voxel chunks only -- there are no blood decals. Sprays
# and gibs collide and settle where they land, which is what leaves the mark.
# A profile with no id match still bleeds: `default` below is the fallback, so
# every creature bleeds something unless it opts out with blood = "none".

# --- creatures ---------------------------------------------------------------

# The fallback. Anything whose `blood` names no known profile bleeds this, so a
# new enemy bleeds correctly before anyone remembers to give it a profile, and a
# typo costs a shade of red rather than all feedback that the hit landed. Use
# blood = "none" for something that genuinely does not bleed.
[[profile]]
id = "default"
spray_effect = "blood_spray"
gib_effect = "blood_gibs"
drip_effect = "blood_drip"
drip_hp_fraction = 0.35
amount_scale = 1.0
damage_bias = 0.55

[[profile]]
id = "human"
spray_effect = "blood_spray"
gib_effect = "blood_gibs"
drip_effect = "blood_drip"
drip_hp_fraction = 0.35
amount_scale = 1.0
damage_bias = 0.55

[[profile]]
id = "boss"
spray_effect = "blood_spray"
gib_effect = "blood_gibs"
drip_effect = "blood_drip"
drip_hp_fraction = 0.5
# A boss bleeds visibly more than a rat without needing its own effects.
amount_scale = 2.4
damage_bias = 0.5

[[profile]]
id = "undead_ichor"
spray_effect = "blood_spray"
drip_hp_fraction = 0.25
amount_scale = 0.7
# Ichor sprays along the surface rather than back at the attacker: it reads as
# oozing out rather than as arterial.
damage_bias = 0.2
