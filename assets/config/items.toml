# Everything that can be in a container.
#
# Two kinds of row. `[archetype.<id>]` rows are templates that never exist in
# the world; `[item.<id>]` rows do, and may name an archetype (or another item)
# in `inherits`. Inheritance is field-wise and transitive -- exactly the shape
# enemies.toml uses -- so an archetype supplies every value a row does not
# state, and a row that only wants a different weight writes one line.
#
# ADDING AN ITEM IS ADDING A TABLE. There is no registration call and no C++.
#
# FIELDS
#   category      junk | reagent | consumable | weapon | armour | trinket |
#                 relic | key | currency
#   rarity        common | uncommon | rare | arcane | relic  (tooltip accent)
#   slot          none | head | body | hands | cloak | amulet | ring | sigil
#   stack         max per stack; anything with durability must be 1
#   weight        kg-ish, against the carry capacity
#   size          [w, h] cells, for containers running in grid mode
#   value         base market price; the trader's curve moves from here
#   elasticity    how hard the price swings with supply/demand (0 pins it)
#   durability    0 = does not wear
#   modifier      [[item.x.modifier]] stat = "..", flat = .., percent = ..
#   resistance    [item.x.resistance] fire = 0.25   (channels from magic.toml)
#   use           [item.x.use] kind = "restore_health", magnitude = 40
#   mesh/material world presentation of the dropped pickup; both optional

# =============================================================================
# archetypes
# =============================================================================

[archetype.base]
name = "Thing"
category = "junk"
rarity = "common"
stack = 1
weight = 0.5
value = 1

[archetype.reagent]
inherits = "base"
category = "reagent"
stack = 20
weight = 0.1
value = 6
elasticity = 0.45          # reagents are exactly what a player floods a market with
pickup_scale = 0.7
tags = ["reagent"]

[archetype.consumable]
inherits = "base"
category = "consumable"
stack = 5
weight = 0.25
value = 20
elasticity = 0.3

[archetype.armour]
inherits = "base"
category = "armour"
stack = 1
weight = 4.0
value = 120
durability = 100.0
worn_value_floor = 0.25
size = [2, 2]
elasticity = 0.2

[archetype.relic]
inherits = "base"
category = "relic"
rarity = "relic"
stack = 1
weight = 1.2
value = 900
elasticity = 0.1           # a relic's worth barely moves; there are not many
drop_on_death = true
tags = ["lodge"]

