# --- shotgun ------------------------------------------------------------------
#
# The shell-by-shell reload is the point of this weapon. It can be interrupted
# by firing, so a player with two shells loaded can break off and shoot, which
# is a decision the magazine weapons never offer.

[player_weapon.xm1014]
slot = 3
name = "XM1014 SHOTGUN"
discipline = "SHOTGUN / 12G"
payload = "buckshot"
fire_mode = "projectile"
trigger = "press"
fire_interval = 0.30
arc_cost = 0.0
# Eight pellets on one trigger pull, spending one shell -- `cost_per_shot`
# is 1 while `projectile_count` is 8, which is exactly why they are separate.
projectile_count = 8
spread_degrees = 9.0
switch_time = 0.30
muzzle_offset = [0.12, -0.12, 0.52]
muzzle_effect = "eidolon_muzzle"
fire_sound = "weapon.eidolon.fire"

[player_weapon.xm1014.projectile]
shape = "sphere"
visual_scale = [0.005, 0.022, 0.005]
material = "Game/Prototype/Bolt"
trail_effect = ""
impact_effect = "eidolon_impact"
impact_sound = "weapon.eidolon.impact"
# Scaled muzzle velocity -- see the note at the head of this file.
speed = 150.0
lifetime = 2.20
radius = 0.0090
mass = 0.0030
# A real bullet: it falls, and it slows.
gravity_factor = 1.0
drag = 0.0700
aim_range = 250.0

[player_weapon.xm1014.ammo]
magazine = 7
reserve = 32
reserve_max = 64
# One shell at a time. `reload_seconds` is the time PER SHELL here, not for the
# whole magazine, which is why it is so much shorter than a rifle's.
shell_by_shell = true
reload_seconds = 0.55
reload_empty_seconds = 0.75
cost_per_shot = 1
ammo_type = "12g"
reload_animation = "draw"

[player_weapon.xm1014.viewmodel]
# This weapon wears an ANIMATED rig: the gun is part of the hands
# mesh and the reload/fire clips were authored against it, so there
# is no separate model to attach and no socket to hang it on.
hands_rig = "hands_shotgun"
hands_idle_animation = "idle"
hands_fire_animation = "fire"
hands_draw_animation = "draw"
hands_reload_animation = "reload"
# Barrel tip, in the weapon model's own space: half the mesh's
# 1.00 m length forward, on the bore line.
barrel_offset = [0.0, 0.0120, -0.5200]
position = [0.16, -0.25, -0.52]
rotation = [-4.0, 4.0, 0.5]
glow_school = "none"
glow_strength = 0.0
material = "Builtin/Firearms/FirearmsXm1014"
muzzle_socket = "weapon_muzzle"

