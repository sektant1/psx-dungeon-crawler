# The modern firearm loadout.
#
# Read by the same PlayerWeaponLibrary that reads weapons.toml, in the same
# format -- see the long comment at the top of that file for what every key
# means. This is a second file rather than more tables in the first because the
# two are different games' loadouts: weapons.toml is the fantasy set (ARC-costed
# spells and bolts) and this is the shooter's.
#
# --- what makes these different from the fantasy set -------------------------
#
# MAGAZINES. Every weapon here carries an `[.ammo]` block, which the fantasy set
# does not, and that block is the pacing mechanism: ARC regenerates on its own,
# a magazine does not. `arc_cost = 0.0` throughout, so ammunition is the ONLY
# resource these spend.
#
# BALLISTICS. Every round here is a simulated projectile, not a hitscan: it
# leaves the barrel at a muzzle velocity, it falls, it slows against drag, and
# it is pushed by wind. At the ranges a level actually offers, that reads as a
# flat trajectory with a noticeable drop past ~80 m -- which is the point. A
# hitscan rifle cannot miss for a reason the player can see and correct.
#
# Muzzle velocities are SCALED DOWN. A real 5.56 leaves the barrel at ~920 m/s,
# which at a 60 Hz fixed step is 15 metres per tick -- through most rooms in one
# frame, so the round is never drawn in flight and the physics has to sweep it
# anyway. The numbers here are ~1/3 of real, which keeps the trajectory readable
# and the relative ordering of the cartridges honest (the AWP still outruns the
# Glock by the same ratio).
#
# BARREL EXIT. `barrel_offset` in each viewmodel block is the muzzle in the gun
# MODEL's own space, so a round leaves the end of the barrel you can see rather
# than the camera or the player's fist. It rides the weapon node, so recoil
# moves the muzzle with the gun.
#
# NUMBERS. Fire intervals are real cyclic rates (an AK is ~600 rpm, so 0.1 s),
# magazine sizes are the real capacities, and reload times are roughly what the
# real handling takes. They are a starting point tuned for readability, not a
# simulation -- damage in particular is game numbers, not ballistics.
#
# `slot` is the number key that selects the weapon. Slots need not be unique
# across the two files; whichever loadout the level loads owns its own slots.

# --- sidearm ------------------------------------------------------------------

[player_weapon.glock]
slot = 0
name = "GLOCK 18"
discipline = "SIDEARM / 9MM"
payload = "bullet_9mm"
fire_mode = "projectile"
trigger = "press"
fire_interval = 0.11
arc_cost = 0.0
projectile_count = 1
spread_degrees = 0.9
switch_time = 0.16
muzzle_offset = [0.10, -0.12, 0.32]
muzzle_effect = "eidolon_muzzle"
fire_sound = "weapon.eidolon.fire"

[player_weapon.glock.projectile]
shape = "sphere"
visual_scale = [0.006, 0.024, 0.006]
material = "Game/Prototype/Bolt"
trail_effect = ""
impact_effect = "eidolon_impact"
impact_sound = "weapon.eidolon.impact"
# Scaled muzzle velocity -- see the note at the head of this file.
speed = 190.0
lifetime = 2.20
radius = 0.0100
mass = 0.0080
# A real bullet: it falls, and it slows.
gravity_factor = 1.0
drag = 0.0200
aim_range = 250.0

[player_weapon.glock.ammo]
magazine = 17
reserve = 68
reserve_max = 136
reload_seconds = 1.5
reload_empty_seconds = 2.1
ammo_type = "9mm"
reload_animation = "draw"

[player_weapon.glock.viewmodel]
# This weapon wears an ANIMATED rig: the gun is part of the hands
# mesh and the reload/fire clips were authored against it, so there
# is no separate model to attach and no socket to hang it on.
hands_rig = "hands_pp19"
hands_idle_animation = "idle"
hands_fire_animation = "fire"
hands_draw_animation = "draw"
hands_reload_animation = "reload"
# Barrel tip, in the weapon model's own space: half the mesh's
# 0.19 m length forward, on the bore line.
barrel_offset = [0.0, 0.0100, -0.1150]
position = [0.13, -0.20, -0.42]
rotation = [-3.0, 3.0, 0.0]
glow_school = "none"
glow_strength = 0.0
material = "Builtin/Firearms/FirearmsGlock"
muzzle_socket = "weapon_muzzle"

