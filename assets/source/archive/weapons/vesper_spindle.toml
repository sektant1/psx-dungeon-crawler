# ARCHIVED -- the Vesper Spindle, lifted out of the shipped loadout.
#
# Kept whole rather than deleted: it is a tuned weapon (cadence, projectile,
# viewmodel parts and hand animations), and the reason it left the loadout is a
# design decision that can be reversed.
#
# To restore it:
#   1. Paste the section below back into assets/config/weapons.toml.
#   2. Give it a free `slot` (the shipped loadout uses 0 and 1), or renumber.
#   3. Nothing else is needed. Its damage payload ([weapon.vesper_needle]), its
#      particle effects (vesper_muzzle / vesper_trail / vesper_impact) and its
#      audio cues (weapon.vesper.fire / weapon.vesper.impact) were left in place
#      -- they are resources, not the weapon, and removing them would make this
#      file un-restorable on its own.
#
# This file is under assets/source, which is not a runtime mount: the game never
# reads it.

[player_weapon.vesper_spindle]
slot = 0
name = "VESPER SPINDLE"
discipline = "NEEDLE / PRECISION"
payload = "vesper_needle"
trigger = "automatic"
fire_interval = 0.14
arc_cost = 2.0
projectile_count = 1
spread_degrees = 0.0
switch_time = 0.16
muzzle_offset = [0.18, -0.15, 0.42]
muzzle_effect = "vesper_muzzle"
fire_sound = "weapon.vesper.fire"
[player_weapon.vesper_spindle.projectile]
shape = "cone"
visual_scale = [0.035, 0.22, 0.035]
material = "Game/Prototype/ProjectileVesper"
trail_effect = "vesper_trail"
impact_effect = "vesper_impact"
impact_sound = "weapon.vesper.impact"
speed = 72.0
lifetime = 1.10
radius = 0.025
mass = 0.06
gravity_factor = 0.0
aim_range = 80.0
[player_weapon.vesper_spindle.viewmodel]
position = [0.25, -0.26, -0.55]
rotation = [-8.0, 7.0, 3.0]
glow_school = "arcane"
glow_strength = 0.70
hands_idle_animation = "finger_gun_idle"
hands_draw_animation = "finger_gun_fix"
hands_fire_animation = "finger_gun_fire"
hands_muzzle_joint = "f_index.03.R"
hands_muzzle_offset = [0.0, 0.025, 0.0]
fire_duration = 0.14
recoil_distance = 0.055
recoil_pitch_degrees = 5.0
recoil_yaw_degrees = 1.5
recoil_recovery = 24.0
movement_bob = 0.010
movement_bob_speed = 8.0
idle_sway = 0.004
look_sway = 0.0011
[[player_weapon.vesper_spindle.viewmodel.part]]
shape = "cylinder"
position = [0.0, 0.0, 0.0]
rotation = [0.0, 0.0, 0.0]
scale = [0.035, 0.30, 0.035]
material = "Game/ViewModelVesper"
[[player_weapon.vesper_spindle.viewmodel.part]]
shape = "sphere"
position = [0.0, 0.18, 0.0]
rotation = [0.0, 0.0, 0.0]
scale = [0.075, 0.075, 0.075]
material = "Game/ViewModelVesperGlow"
enchanted = true
