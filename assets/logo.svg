<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="redSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a3d"/>
      <stop offset="0.55" stop-color="#ce211c"/>
      <stop offset="1" stop-color="#72100f"/>
    </linearGradient>
    <linearGradient id="boneSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="0.55" stop-color="#d8d3c5"/>
      <stop offset="1" stop-color="#77746d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d8d3c5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.32"/>
    </pattern>
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feFlood flood-color="#e7352d" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="38" y="38" width="1524" height="824"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#070707"/>
  <rect x="38" y="38" width="1524" height="824" fill="url(#grid)" stroke="#343330" stroke-width="2"/>

  <g clip-path="url(#frameClip)" opacity="0.8">
    <path d="M-100 758 L412 462 L924 758" fill="none" stroke="#d8d3c5" stroke-opacity="0.09" stroke-width="2"/>
    <path d="M34 758 L412 540 L790 758 M174 758 L412 620 L650 758 M300 758 L412 694 L524 758" fill="none" stroke="#d8d3c5" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M412 462 V862 M314 518 L314 862 M510 518 L510 862" fill="none" stroke="#d8d3c5" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <g aria-label="wireframe volume" fill="none" stroke-linejoin="bevel">
    <path d="M381 126 L659 286 L381 446 L103 286 Z" stroke="#d8d3c5" stroke-opacity="0.7" stroke-width="5"/>
    <path d="M103 286 V598 L381 758 L659 598 V286" stroke="#d8d3c5" stroke-opacity="0.5" stroke-width="5"/>
    <path d="M381 446 V758" stroke="#d8d3c5" stroke-opacity="0.32" stroke-width="3" stroke-dasharray="12 12"/>
    <path d="M103 598 L381 438 L659 598 L381 758 Z" stroke="#e7352d" stroke-opacity="0.75" stroke-width="4"/>
    <path d="M381 126 V446 M103 286 L381 446 L659 286" stroke="#e7352d" stroke-opacity="0.25" stroke-width="3"/>
  </g>

  <g aria-label="V mark" filter="url(#redGlow)">
    <path d="M173 294 H284 L381 526 L478 294 H589 L381 692 Z" fill="url(#redSteel)"/>
    <path d="M199 314 H262 L381 598 L500 314 H563 L381 656 Z" fill="none" stroke="#ff7569" stroke-opacity="0.7" stroke-width="5"/>
  </g>

  <g fill="#070707">
    <rect x="168" y="356" width="78" height="20"/>
    <rect x="510" y="406" width="82" height="18"/>
    <rect x="336" y="566" width="44" height="18"/>
    <rect x="400" y="628" width="34" height="14"/>
  </g>

  <g fill="#d8d3c5">
    <rect x="92" y="273" width="22" height="22"/>
    <rect x="370" y="115" width="22" height="22"/>
    <rect x="648" y="275" width="22" height="22"/>
    <rect x="92" y="587" width="22" height="22"/>
    <rect x="370" y="747" width="22" height="22"/>
    <rect x="648" y="587" width="22" height="22"/>
  </g>

  <g font-family="DejaVu Sans Mono, monospace" font-weight="700">
    <text x="758" y="186" fill="#e7352d" font-size="24" letter-spacing="8">VK 1.3 // C++20</text>
    <rect x="758" y="218" width="716" height="8" fill="#e7352d"/>

    <text x="744" y="376" fill="url(#boneSteel)" font-size="132" letter-spacing="4">VULKAN</text>
    <text x="744" y="520" fill="url(#boneSteel)" font-size="116" letter-spacing="-2">RETRO 3D</text>
    <text x="744" y="664" fill="url(#redSteel)" font-size="132" letter-spacing="13">ENGINE</text>

    <rect x="758" y="713" width="716" height="3" fill="#d8d3c5" fill-opacity="0.65"/>
    <text x="758" y="770" fill="#d8d3c5" font-size="24" letter-spacing="4">LOW RESOLUTION. FULL CONTROL.</text>
    <text x="758" y="817" fill="#6e6b65" font-size="18" letter-spacing="3">EXPLICIT RENDERING // FIXED STEP // DATA FIRST</text>
  </g>

  <g fill="#e7352d">
    <rect x="1474" y="118" width="12" height="74"/>
    <rect x="1450" y="142" width="60" height="12"/>
    <rect x="1474" y="732" width="12" height="74"/>
    <rect x="1450" y="770" width="60" height="12"/>
  </g>

  <rect width="1600" height="900" fill="url(#scanlines)" opacity="0.3" pointer-events="none"/>
</svg>
