# The content manifest.
#
# ONE tree, organised by asset TYPE. There is no engine/game/editor/demo split
# in here: every application mounts this same content and can reach all of it.
# Which app an asset happens to be used by is a property of the code that names
# it, not of where the file lives.
#
#   config/       TOML the game and tools read by name
#   materials/    Ogre .material scripts
#   meshes/       .obj geometry (kit/, props/, and loose primitives)
#   textures/     .png, by subject (dungeon/, props/, prototype/, surfaces/, vfx/)
#   shaders/      GLSL
#   programs/     Ogre .program declarations binding the GLSL
#   compositors/  Ogre .compositor scripts
#   particles/    particle texture atlases + the sheet/flipbook descriptions
#   fonts/        bitmap + TTF
#   ui/           UI data (hint text)
#   scenes/       .scn sources and cooked .map
#   schemas/      JSON Schema for the editor's scene format
#   templates/    authoring templates, never loaded at runtime
#   source/       pipeline INPUTS: archives, .blend, raw sprite packs. Not
#                 loaded by anything; gitignored by extension.
schema = 1

[[pack]]
id = "content"
dir = "."
# The directories registered with Ogre's flat resource group. Anything not
# listed is data read by explicit path (meshes, config, scenes), and must NOT
# be a resource location -- that is what keeps authoring debris and source art
# out of the group.
#
# particles/textures/sheets is load-bearing: sprite_sheets.toml names a bare
# filename ("bullet16.png") and ParticleMaterials binds it straight to a
# texture unit, so Ogre has to find it by basename. Without it the 304
# sheet-backed particle textures all fall back to PINKY.
resources = [
    "materials",
    "programs",
    "shaders",
    "compositors",
    "fonts",
    "ui",
    "textures",
    "textures/dungeon",
    "textures/props",
    "textures/prototype",
    "textures/surfaces",
    "textures/vfx",
    "particles/textures",
    "particles/textures/sheets",
]

# Every app mounts the same single pack. The sets are kept as distinct names so
# an app can still be given its own overlay later without touching call sites.
[mounts]
game = ["content"]
editor = ["content"]
demo = ["content"]

# D9: how a logical id becomes a file. First hit wins, so a cooked or upgraded
# asset supersedes its source with no data edit. Declared here so the manifest
# is the one place the question is answered; the resolver starts reading it in
# phase P9.
[formats]
mesh = [".mesh", ".glb", ".gltf", ".obj"]
texture = [".png"]

# D14: materials hidden from Renderer::materialNames() -- a manifest flag, not
# a "__" name prefix.
[materials]
internal = ["Editor/PlacementGhost", "Engine/Psx/PreviewSprite"]
