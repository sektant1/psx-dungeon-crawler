# Engine material definitions. Generated once from the Ogre script
# this file replaced (editor.material); hand-edited since.
#
# `shader` names the engine shader family outright. It used to be
# recovered by substring-matching an Ogre program name, which meant a
# rename silently changed how a material drew.

[material."Editor/Checkerboard"]
shader = "editor.checkerboard"

[material."Editor/Checkerboard".params]
checkerColourA = [0.52, 0.53, 0.55, 1.0]
checkerColourB = [0.30, 0.31, 0.33, 1.0]
checkerScale = 0.5

[material."Editor/CheckerboardDark"]
shader = "editor.checkerboard"

[material."Editor/CheckerboardDark".params]
checkerColourA = [0.16, 0.165, 0.18, 1.0]
checkerColourB = [0.09, 0.095, 0.11, 1.0]
checkerScale = 0.5

[material."Editor/FireIcon"]
shader = "editor.icon"
cull = "none"
depth_write = false

[material."Editor/PlacementGhost"]
shader = "editor.ghost"
cull = "none"
blend = "alpha"
depth_write = false
