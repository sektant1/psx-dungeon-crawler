# Engine material definitions. Generated once from the Ogre script
# this file replaced (prototype_vfx.material); hand-edited since.
#
# `shader` names the engine shader family outright. It used to be
# recovered by substring-matching an Ogre program name, which meant a
# rename silently changed how a material drew.

[material."Engine/PrototypeVfx/Portal"]
shader = "surface.portal"
cull = "none"
depth_write = true
# Stone: keeps outlines and creases, refuses the stylize highlight wash.
highlight = false

[material."Engine/PrototypeVfx/Portal".params]
surfaceDark = [0.06, 0.30, 0.05, 1.0]
surfaceMid = [0.16, 1.05, 0.07, 1.0]
surfaceBright = [0.85, 1.80, 0.20, 1.0]
surfaceCore = [1.55, 2.40, 0.70, 1.0]
portalFlowSpeed = 0.32
portalSwirlSpeed = 0.09
surfaceGlowColour = [1.30, 0.10, 2.20, 1.0]

