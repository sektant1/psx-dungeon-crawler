# Engine material definitions. Generated once from the Ogre script
# this file replaced (kit.material); hand-edited since.
#
# `shader` names the engine shader family outright. It used to be
# recovered by substring-matching an Ogre program name, which meant a
# rename silently changed how a material drew.

[material."Game/Kit/Dungeon"]
shader = "lit"
texture = "Dungeon_Map.png"
address = "clamp"
# Stone: keeps outlines and creases, refuses the stylize highlight wash.
highlight = false

[material."Game/Kit/Dungeon".params]
uvScale = [1.0, -1.0]
uvOffset = [0.0, 1.0]

[material."Game/Kit/DungeonTwoSided"]
shader = "lit"
texture = "Dungeon_Map.png"
address = "clamp"
cull = "none"
# Stone: keeps outlines and creases, refuses the stylize highlight wash.
highlight = false

[material."Game/Kit/DungeonTwoSided".params]
uvScale = [1.0, -1.0]
uvOffset = [0.0, 1.0]

[material."Game/Kit/Doors"]
shader = "lit"
texture = "Doors_Map.png"
address = "clamp"

[material."Game/Kit/Doors".params]
uvScale = [1.0, -1.0]
uvOffset = [0.0, 1.0]

[material."Game/Kit/Containers"]
shader = "lit"
texture = "CratesAndBarrels_Map.png"
address = "clamp"

[material."Game/Kit/Containers".params]
uvScale = [1.0, -1.0]
uvOffset = [0.0, 1.0]

[material."Game/Kit/Metal"]
shader = "lit.metal"
texture = "TEX_Chain_02.png"

[material."Game/Kit/Metal".params]
uvScale = [1.0, -1.0]
uvOffset = [0.0, 1.0]

[material."Game/Kit/Wood"]
shader = "lit"
texture = "TEX_Planks_01.png"

[material."Game/Kit/Wood".params]
uvScale = [1.0, -1.0]
uvOffset = [0.0, 1.0]

[material."Game/Kit/Stone"]
shader = "lit"
texture = "TEX_Wall_03.png"
# Stone: keeps outlines and creases, refuses the stylize highlight wash.
highlight = false

[material."Game/Kit/Stone".params]
uvScale = [1.0, -1.0]
uvOffset = [0.0, 1.0]
